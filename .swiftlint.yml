included:
  - Sources
  - Tests
  - Showcase/DesignSystemShowcase

excluded:
  - .build
  - .swiftpm
  - Showcase/DesignSystemShowcase.xcodeproj

opt_in_rules:
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - implicit_return
  - joined_default_parameter
  - last_where
  - modifier_order
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_parameters
  - overridden_super_call
  - prefer_self_in_static_references
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

# Layout belongs to SwiftFormat (see .swiftformat); keep SwiftLint to code quality.
disabled_rules:
  - redundant_discardable_let
  - todo
  - void_function_in_ternary

line_length:
  warning: 120
  error: 160
  ignores_urls: true
  ignores_comments: true

file_length:
  warning: 400
  error: 800

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 80
  error: 150

function_parameter_count:
  warning: 8
  error: 12

cyclomatic_complexity:
  warning: 12
  error: 20
  ignores_case_statements: true

generic_type_name:
  max_length:
    warning: 30

identifier_name:
  min_length:
    warning: 2
  excluded:
    - x
    - y
    - id
    - _body
    - to

type_name:
  min_length: 3
  max_length: 50

nesting:
  type_level: 2

reporter: xcode
